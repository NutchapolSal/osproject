# reference
# https://github.com/danbooru/danbooru/blob/master/.github/workflows/docker-build.yaml

name: Publish Docker image

on:
  push:
  create:

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Build and Push Docker image to registries
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_APIKEY }}

      - uses: docker/login-action@v4
        name: Log in to GitHub Container Registry
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            nutchapolsal/osproject
            ghcr.io/nutchapolsal/osproject
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/nutchapolsal/osproject:buildcache
          cache-to: type=registry,ref=ghcr.io/nutchapolsal/osproject:buildcache,mode=max
